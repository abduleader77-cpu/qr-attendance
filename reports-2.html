<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance reports · QR Attendance</title>
<link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:560px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th{text-align:left;color:var(--muted);font-weight:400;font-size:13px;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;color:#1b2a2f}
.ok{background:#8fd9b6}.mid{background:var(--amber)}.low{background:#f2a39d}
h2{font-size:16px;margin:0}
.del{color:var(--red);font-size:13px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div><h1>Attendance reports</h1><p class="sub" id="sub">Loading…</p></div>
  </div>

  <div class="card hide" id="top">
    <label for="course" style="margin-top:0">Course</label>
    <select id="course"></select>
    <div class="sub" id="total" style="margin-top:10px"></div>
  </div>

  <div class="card hide" id="cls" style="margin-top:14px">
    <h2>Class by class</h2>
    <table><thead><tr><th>Class</th><th class="r">Present</th><th class="r">Rate</th></tr></thead><tbody id="sess"></tbody></table>
  </div>

  <div class="card hide" id="stu" style="margin-top:14px">
    <h2>Students</h2>
    <table><thead><tr><th>Student</th><th class="r">Attended</th><th class="r">Rate</th></tr></thead><tbody id="rows"></tbody></table>
    <button id="csv">Download CSV</button>
  </div>

  <button class="ghost" onclick="location.href='dashboard.html'">Back</button>
  <div class="msg" id="msg" role="alert"></div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { doc, getDoc, getDocs, deleteDoc, collection, query, where } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pill = p => p === null ? "–" : "<span class='pill " + (p >= 75 ? "ok" : p >= 50 ? "mid" : "low") + "'>" + p + "%</span>";
let courses = [], sessions = [], enr = {}, cur = [];

onAuthStateChanged(auth, async u => {
  if (!u) { location.href = "index.html"; return; }
  try {
    const me = await getDoc(doc(db, "users", u.uid));
    if (!me.exists() || me.data().role !== "lecturer") { location.href = "dashboard.html"; return; }
    courses = (await getDocs(query(collection(db, "courses"), where("lecturerId", "==", u.uid)))).docs.map(d => ({ id: d.id, ...d.data() }));
    sessions = (await getDocs(query(collection(db, "sessions"), where("lecturerId", "==", u.uid)))).docs
      .map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt);
    await Promise.all([
      ...sessions.map(async s => {
        const a = await getDocs(query(collection(db, "attendance"), where("sessionId", "==", s.id)));
        s.att = a.docs.map(x => x.data()); s.refs = a.docs.map(x => x.ref);
      }),
      ...courses.map(async c => {
        enr[c.id] = (await getDocs(query(collection(db, "enrollments"), where("courseId", "==", c.id)))).docs.map(x => x.data());
      })
    ]);
    refresh();
  } catch (e) { $("sub").textContent = "Couldn't load reports. Check your internet connection and refresh."; }
});

function refresh() {
  const old = sessions.some(s => !s.courseId), keep = $("course").value;
  if (!courses.length && !old) {
    ["top", "cls", "stu"].forEach(i => $(i).classList.add("hide"));
    $("sub").textContent = "No courses or classes yet. Create a course, then start a class.";
    return;
  }
  $("sub").textContent = "Pick a course to see its attendance.";
  $("course").innerHTML = "";
  courses.forEach(c => $("course").add(new Option(c.code + " · " + c.title, c.id)));
  if (old) $("course").add(new Option("Old test sessions (no course)", "__old"));
  if ([...$("course").options].some(o => o.value === keep)) $("course").value = keep;
  $("course").onchange = render;
  $("top").classList.remove("hide"); $("cls").classList.remove("hide");
  render();
}

function render() {
  const id = $("course").value, isOld = id === "__old";
  const list = sessions.filter(s => isOld ? !s.courseId : s.courseId === id), st = isOld ? [] : (enr[id] || []);
  $("stu").classList.toggle("hide", isOld);
  $("total").textContent = list.length + (list.length === 1 ? " class held" : " classes held") + (isOld ? "" : " · " + st.length + " registered");
  $("sess").innerHTML = list.length ? list.map(s => {
    const n = st.filter(e => e.enrolledAt <= s.createdAt).length;
    const p = isOld || !n ? null : Math.min(100, Math.round(s.att.length / n * 100));
    return "<tr><td>" + new Date(s.createdAt).toLocaleString() + "<br><span class='sub'>" + esc(s.room) + " · <a class='del' data-id='" + s.id +
      "'>Delete</a></span></td><td class='r'>" + s.att.length + (isOld ? "" : " / " + n) + "</td><td class='r'>" + pill(p) + "</td></tr>";
  }).join("") : "<tr><td class='sub'>No classes yet for this course.</td></tr>";
  cur = st.map(e => {
    const mine = list.filter(s => s.createdAt >= e.enrolledAt);
    const n = mine.filter(s => s.att.some(a => a.studentId === e.studentId)).length;
    return { name: e.name, id: e.idNumber, n, total: mine.length, pct: mine.length ? Math.round(n / mine.length * 100) : 0 };
  }).sort((a, b) => a.name.localeCompare(b.name));
  $("rows").innerHTML = cur.length ? cur.map(x => "<tr><td>" + esc(x.name) + "<br><span class='sub'>" + esc(x.id) + "</span></td><td class='r'>" + x.n + " / " + x.total +
    "</td><td class='r'>" + pill(x.pct) + "</td></tr>").join("") : "<tr><td class='sub'>No students registered yet.</td></tr>";
}

$("sess").onclick = async e => {
  const id = e.target.dataset && e.target.dataset.id; if (!id) return;
  const s = sessions.find(x => x.id === id);
  if (!s || !confirm("Delete this class and its " + s.att.length + " attendance record(s)? This can't be undone.")) return;
  $("msg").textContent = "Deleting…";
  try {
    for (const r of s.refs) await deleteDoc(r);
    await deleteDoc(doc(db, "sessions", s.id));
    sessions = sessions.filter(x => x.id !== id); $("msg").textContent = ""; refresh();
  } catch (err) { $("msg").textContent = "Couldn't delete. Check your internet connection and try again."; }
};

$("csv").onclick = () => {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const out = ["Name,ID,Attended,Total,Percent"].concat(cur.map(x => [q(x.name), q(x.id), x.n, x.total, x.pct].join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], { type: "text/csv" }));
  a.download = ($("course").selectedOptions[0].text.split(" · ")[0] || "attendance").replace(/\s+/g, "_") + ".csv";
  a.click();
};
</script>
</body>
</html>
