<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class session · QR Attendance</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div><h1>Class session</h1><p class="sub">Show the code. Students scan.</p></div>
  </div>

  <div class="card" id="setup">
    <label for="course">Course</label>
    <select id="course"></select>
    <label for="room">Room</label>
    <input id="room" placeholder="LT2">
    <button id="start">Start session</button>
    <button class="ghost" onclick="location.href='dashboard.html'">Back</button>
  </div>

  <div class="card hide" id="live" style="text-align:center">
    <div style="font-weight:700" id="title"></div>
    <div id="qr" style="background:#fff;padding:12px;border-radius:6px;display:inline-block;margin:14px 0"></div>
    <div class="sub" id="timer"></div>
    <div style="font-size:40px;font-weight:700;margin:8px 0" id="count">0</div>
    <div class="sub">students present</div>
    <div id="list" style="text-align:left;margin-top:14px;font-size:14px"></div>
    <button id="end" class="ghost">End session</button>
  </div>
  <div class="msg" id="msg" role="alert"></div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { doc, getDoc, getDocs, setDoc, addDoc, updateDoc, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const ROTATE = 30;
let uid, ref, tref, sid, qr, left = ROTATE, tick, courses = [];

onAuthStateChanged(auth, async u => {
  if (!u) { location.href = "index.html"; return; }
  const d = await getDoc(doc(db, "users", u.uid));
  if (!d.exists() || d.data().role !== "lecturer") { location.href = "dashboard.html"; return; }
  uid = u.uid;
  courses = (await getDocs(query(collection(db, "courses"), where("lecturerIds", "array-contains", uid)))).docs.map(x => ({ id: x.id, ...x.data() })).filter(c => c.status !== "pending");
  if (courses.length) courses.forEach(c => $("course").add(new Option(c.code + " · " + c.title, c.id)));
  else $("msg").textContent = "No approved course yet. Request one under My courses and wait for the admin to approve it.";
});

const newToken = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, "0")).join("");
const link = t => new URL("scan.html", location.href).href + "?s=" + sid + "&t=" + t;

function showQR(t) {
  if (!qr) qr = new QRCode($("qr"), { text: link(t), width: 220, height: 220 });
  else qr.makeCode(link(t));
}

async function rotate() {
  const t = newToken();
  await updateDoc(tref, { token: t, tokenExpires: Date.now() + 40000 });
  showQR(t); left = ROTATE;
}

$("start").onclick = () => {
  const c = courses.find(x => x.id === $("course").value), room = $("room").value.trim();
  if (!c || !room) { $("msg").textContent = "Pick a course and enter the room."; return; }
  $("msg").textContent = "";
  (async () => {
    try {
      const t = newToken();
      const r = await addDoc(collection(db, "sessions"), {
        courseId: c.id, course: c.code, room, lecturerId: uid, active: true,
        createdAt: Date.now()
      });
      ref = r; sid = r.id;
      tref = doc(db, "sessionTokens", sid);
      await setDoc(tref, { token: t, tokenExpires: Date.now() + 40000, lecturerId: uid });
      $("setup").classList.add("hide"); $("live").classList.remove("hide"); $("msg").textContent = "";
      $("title").textContent = c.code + " · " + room;
      showQR(t);
      tick = setInterval(() => {
        left--; $("timer").textContent = "New code in " + left + "s";
        if (left <= 0) rotate();
      }, 1000);
      onSnapshot(query(collection(db, "attendance"), where("sessionId", "==", sid)), s => {
        $("count").textContent = s.size;
        $("list").innerHTML = s.docs.map(x => "<div>" + x.data().name + " · " + x.data().idNumber + "</div>").join("");
      });
    } catch (e) { $("msg").textContent = "Couldn't start the session. Check your internet and retry."; }
  })();
};

$("end").onclick = async () => {
  clearInterval(tick);
  await updateDoc(ref, { active: false });
  location.href = "dashboard.html";
};
</script>
</body>
</html>
