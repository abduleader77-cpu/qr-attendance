<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan QR code · QR Attendance</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div><h1>Scan QR code</h1><p class="sub">Point at the lecturer's screen.</p></div>
  </div>
  <div class="card">
    <div id="reader" style="width:100%;min-height:260px"></div>
    <div class="sub" style="margin-top:10px">Hold your phone steady, about 20 to 30 cm from the screen, and fit the whole code inside the frame.</div>
    <div class="msg" id="msg" role="alert"></div>
    <button class="ghost" onclick="location.href='dashboard.html'">Cancel</button>
  </div>
</div>

<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const $ = id => document.getElementById(id);
let started = false;

onAuthStateChanged(auth, u => {
  if (!u) { location.href = "index.html"; return; }
  if (started) return;
  started = true;
  const q = new Html5Qrcode("reader", { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
  let done = false;

  const onScan = async text => {
    if (done) return;
    try {
      const url = new URL(text);
      const s = url.searchParams.get("s"), t = url.searchParams.get("t");
      if (!s || !t) { $("msg").textContent = "That isn't an attendance code. Try again."; return; }
      done = true;
      await q.stop();
      location.href = "scan.html?s=" + encodeURIComponent(s) + "&t=" + encodeURIComponent(t);
    } catch (e) { $("msg").textContent = "That isn't an attendance code. Try again."; }
  };

  const base = { fps: 15, aspectRatio: 1, qrbox: (w, h) => { const n = Math.floor(Math.min(w, h) * 0.85); return { width: n, height: n }; } };
  const run = cfg => q.start({ facingMode: "environment" }, cfg, onScan, () => {});
  run({ ...base, videoConstraints: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 1280 } } })
    .catch(() => run(base))
    .catch(() => { $("msg").textContent = "Allow camera access in your browser, then reopen this page."; });
});
</script>
</body>
</html>
