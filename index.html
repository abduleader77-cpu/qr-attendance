<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Attendance</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div><h1>QR Attendance</h1><p class="sub">Scan in. Get counted.</p></div>
  </div>

  <div class="card">
    <h2 id="title" style="margin:0;font-size:18px">Log in</h2>

    <div id="regFields" class="hide">
      <label for="name">Full name</label>
      <input id="name" autocomplete="name" placeholder="Abdulrahman Umar">
      <label for="role">I am a</label>
      <select id="role"><option value="student">Student</option><option value="lecturer">Lecturer</option></select>
      <label for="idno">Matric or staff number</label>
      <input id="idno" placeholder="21/CSC/045">
    </div>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="name@gmail.com">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="At least 6 characters">

    <button id="go">Log in</button>
    <div class="msg" id="msg" role="alert"></div>
    <div class="switch"><span id="swText">New here?</span> <a id="swLink">Create account</a></div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
let mode = "login", busy = false;

onAuthStateChanged(auth, u => { if (u && !busy) location.href = "dashboard.html"; });

function setMode(m) {
  mode = m;
  const reg = m === "register";
  $("regFields").classList.toggle("hide", !reg);
  $("title").textContent = reg ? "Create account" : "Log in";
  $("go").textContent = reg ? "Create account" : "Log in";
  $("swText").textContent = reg ? "Already registered?" : "New here?";
  $("swLink").textContent = reg ? "Log in" : "Create account";
  $("msg").textContent = "";
}
$("swLink").onclick = () => setMode(mode === "login" ? "register" : "login");

function friendly(e) {
  const c = e.code || "";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "Wrong email or password. Check and try again.";
  if (c.includes("email-already-in-use")) return "That email already has an account. Log in instead.";
  if (c.includes("weak-password")) return "Use a password with at least 6 characters.";
  if (c.includes("invalid-email")) return "Enter a valid email address.";
  if (c.includes("network")) return "No internet connection. Check your data and retry.";
  return "Something went wrong. Try again.";
}

$("go").onclick = async () => {
  const email = $("email").value.trim(), pass = $("pass").value;
  $("msg").textContent = "";
  if (!email || !pass) { $("msg").textContent = "Enter your email and password."; return; }
  busy = true; $("go").textContent = "Please wait…";
  try {
    if (mode === "register") {
      const name = $("name").value.trim(), idno = $("idno").value.trim();
      if (!name || !idno) throw { code: "x", custom: "Enter your full name and ID number." };
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, "users", cred.user.uid), {
        name, idNumber: idno, email, role: $("role").value, approved: $("role").value !== "lecturer", createdAt: serverTimestamp()
      });
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
    location.href = "dashboard.html";
  } catch (e) {
    $("msg").textContent = e.custom || friendly(e);
    $("go").textContent = mode === "register" ? "Create account" : "Log in";
    busy = false;
  }
};
</script>
</body>
</html>
