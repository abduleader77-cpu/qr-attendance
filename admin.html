<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · QR Attendance</title>
<link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:560px}
h2{font-size:16px;margin:0 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row button,.sm{width:auto;margin:0;padding:8px 12px;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
label.c{display:flex;gap:10px;align-items:center;margin:8px 0;color:var(--ink);font-size:14px}
label.c input{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card+.card{margin-top:14px}
.ed{padding:6px 0 12px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div><h1>Admin</h1><p class="sub" id="sub">Loading…</p></div>
  </div>

  <div class="card">
    <h2>Lecturers</h2>
    <div id="lects"></div>
  </div>

  <div class="card">
    <h2>Course requests</h2>
    <div id="reqs"></div>
  </div>

  <div class="card">
    <h2>Create a course</h2>
    <label for="code">Course code</label>
    <input id="code" placeholder="CSC 401">
    <label for="title">Course title</label>
    <input id="title" placeholder="Software Engineering">
    <div class="two">
      <div><label for="level">Level</label><select id="level"><option>100</option><option>200</option><option>300</option><option selected>400</option><option>500</option></select></div>
      <div><label for="sem">Semester</label><select id="sem"><option>First</option><option>Second</option></select></div>
    </div>
    <label>Lecturers for this course</label>
    <div id="pick"></div>
    <button id="add">Create course</button>
  </div>

  <div class="card">
    <h2>Students</h2>
    <input id="sq" placeholder="Search by name or matric number" style="margin-top:8px">
    <div id="studs"></div>
  </div>

  <div class="card">
    <h2>Courses</h2>
    <div id="clist"></div>
  </div>

  <button class="ghost" onclick="location.href='dashboard.html'">Back</button>
  <div class="msg" id="msg" role="alert"></div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, collection, query, where } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ok = l => l.approved !== false;
let lects = [], courses = [], studs = [], devs = new Set();

onAuthStateChanged(auth, async u => {
  if (!u) { location.href = "index.html"; return; }
  const d = await getDoc(doc(db, "users", u.uid));
  if (!d.exists() || d.data().role !== "admin") { location.href = "dashboard.html"; return; }
  load();
});

async function load() {
  try {
    lects = (await getDocs(query(collection(db, "users"), where("role", "==", "lecturer")))).docs.map(d => ({ id: d.id, ...d.data() }));
    courses = (await getDocs(collection(db, "courses"))).docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.code.localeCompare(b.code));
    studs = (await getDocs(query(collection(db, "users"), where("role", "==", "student")))).docs.map(d => ({ id: d.id, ...d.data() }));
    devs = new Set((await getDocs(collection(db, "devices"))).docs.map(d => d.id));
    render();
  } catch (e) { $("sub").textContent = "Couldn't load. Check your internet connection and refresh."; }
}

const boxes = (sel, cls) => lects.filter(ok).map(l => "<label class='c'><input type='checkbox' class='" + cls + "' value='" + l.id + "'" +
  (sel.includes(l.id) ? " checked" : "") + "> " + esc(l.name) + " · " + esc(l.idNumber) + "</label>").join("") || "<div class='sub'>No approved lecturers yet.</div>";

function render() {
  const wait = lects.filter(l => !ok(l)).length, pend = courses.filter(c => c.status === "pending"), live = courses.filter(c => c.status !== "pending");
  const bits = [wait ? wait + " lecturer" + (wait === 1 ? "" : "s") : "", pend.length ? pend.length + " course request" + (pend.length === 1 ? "" : "s") : ""].filter(Boolean);
  $("sub").textContent = bits.length ? "Waiting for approval: " + bits.join(" and ") + "." : "Approve lecturers and course requests.";
  $("reqs").innerHTML = pend.length ? pend.map(c => "<div class='row'><div>" + esc(c.code) + " · " + esc(c.title) + "<br><span class='sub'>" + c.level + " level · " + esc(c.semester) +
    " semester · requested by " + esc((c.lecturerNames || []).join(", ")) + "</span></div><div class='acts'><button data-ap='" + c.id + "'>Approve</button><button class='ghost' data-rj='" + c.id + "'>Reject</button></div></div>").join("")
    : "<div class='sub'>No course requests.</div>";
  $("lects").innerHTML = lects.length ? lects.map(l => "<div class='row'><div>" + esc(l.name) + "<br><span class='sub'>" + esc(l.idNumber) + " · " +
    (ok(l) ? "Approved" : "Waiting for approval") + "</span></div><button class='" + (ok(l) ? "ghost" : "") + "' data-t='" + l.id + "'>" + (ok(l) ? "Suspend" : "Approve") + "</button></div>").join("")
    : "<div class='sub'>No lecturers have registered yet.</div>";
  $("pick").innerHTML = boxes([], "pk");
  renderStudents();
  $("clist").innerHTML = live.length ? live.map(c => {
    const names = (c.lecturerNames || (c.lecturerName ? [c.lecturerName] : [])).join(", ") || "No lecturer";
    return "<div class='row'><div>" + esc(c.code) + " · " + esc(c.title) + "<br><span class='sub'>" + (c.level ? c.level + " level · " + esc(c.semester) + " semester · " : "") + esc(names) +
      "</span></div><div class='acts'><button class='ghost' data-e='" + c.id + "'>Lecturers</button><button class='ghost' data-d='" + c.id + "'>Delete</button></div></div><div class='ed hide' id='ed-" + c.id + "'></div>";
  }).join("") : "<div class='sub'>No courses yet.</div>";
}

$("lects").onclick = async e => {
  const b = e.target.closest("button"); if (!b || !b.dataset.t) return;
  const l = lects.find(x => x.id === b.dataset.t);
  try { await updateDoc(doc(db, "users", l.id), { approved: !ok(l) }); load(); }
  catch (err) { $("msg").textContent = "Couldn't update the lecturer. Try again."; }
};

function renderStudents() {
  const q = $("sq").value.trim().toLowerCase();
  const list = studs.filter(s => !q || (s.name + " " + s.idNumber).toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name)).slice(0, 50);
  $("studs").innerHTML = list.length ? list.map(s => "<div class='row'><div>" + esc(s.name) + "<br><span class='sub'>" + esc(s.idNumber) + " · " +
    (devs.has(s.id) ? "Phone linked" : "No phone linked yet") + "</span></div>" +
    (devs.has(s.id) ? "<button class='ghost' data-rs='" + s.id + "'>Reset device</button>" : "") + "</div>").join("") : "<div class='sub'>No students found.</div>";
}
$("sq").oninput = renderStudents;
$("studs").onclick = async e => {
  const b = e.target.closest("button"); if (!b || !b.dataset.rs) return;
  if (!confirm("Reset this student's phone? They can link a new phone on their next scan.")) return;
  try { await deleteDoc(doc(db, "devices", b.dataset.rs)); load(); }
  catch (err) { $("msg").textContent = "Couldn't reset the device. Try again."; }
};

$("reqs").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  try {
    if (b.dataset.ap) await updateDoc(doc(db, "courses", b.dataset.ap), { status: "approved" });
    else if (b.dataset.rj) { if (!confirm("Reject and delete this course request?")) return; await deleteDoc(doc(db, "courses", b.dataset.rj)); }
    else return;
    load();
  } catch (err) { $("msg").textContent = "Couldn't update the request. Try again."; }
};

$("add").onclick = async () => {
  const code = $("code").value.trim().toUpperCase(), title = $("title").value.trim();
  const ids = [...document.querySelectorAll(".pk:checked")].map(x => x.value);
  if (!code || !title) { $("msg").textContent = "Enter the course code and title."; return; }
  if (!ids.length) { $("msg").textContent = "Pick at least one lecturer."; return; }
  if (courses.some(c => c.code === code)) { $("msg").textContent = code + " already exists."; return; }
  try {
    await addDoc(collection(db, "courses"), { code, title, level: Number($("level").value), semester: $("sem").value, lecturerIds: ids,
      lecturerNames: ids.map(i => lects.find(l => l.id === i).name), status: "approved", createdAt: Date.now() });
    $("code").value = ""; $("title").value = ""; $("msg").textContent = ""; load();
  } catch (e) { $("msg").textContent = "Couldn't create the course. Try again."; }
};

$("clist").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.e) {
    const c = courses.find(x => x.id === b.dataset.e), p = $("ed-" + c.id);
    p.classList.toggle("hide");
    p.innerHTML = boxes(c.lecturerIds || [], "ck-" + c.id) + "<button class='sm' data-s='" + c.id + "' style='margin-top:6px'>Save lecturers</button>";
  } else if (b.dataset.s) {
    const id = b.dataset.s, ids = [...document.querySelectorAll(".ck-" + id + ":checked")].map(x => x.value);
    if (!ids.length) { $("msg").textContent = "Pick at least one lecturer."; return; }
    try { await updateDoc(doc(db, "courses", id), { lecturerIds: ids, lecturerNames: ids.map(i => lects.find(l => l.id === i).name) }); $("msg").textContent = ""; load(); }
    catch (err) { $("msg").textContent = "Couldn't save. Try again."; }
  } else if (b.dataset.d) {
    if (!confirm("Delete this course with all its classes, attendance records and student registrations? This can't be undone.")) return;
    $("msg").textContent = "Deleting…";
    try {
      for (const col of ["enrollments", "sessions", "attendance"]) {
        const s = await getDocs(query(collection(db, col), where("courseId", "==", b.dataset.d)));
        for (const d of s.docs) await deleteDoc(d.ref);
      }
      await deleteDoc(doc(db, "courses", b.dataset.d)); $("msg").textContent = ""; load();
    } catch (err) { $("msg").textContent = "Couldn't delete the course. Try again."; }
  }
};
</script>
</body>
</html>
