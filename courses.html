<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses · QR Attendance</title>
<link rel="stylesheet" href="style.css">
<style>.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row button{width:auto;margin:0;padding:8px 14px;font-size:14px}</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div><h1>Courses</h1><p class="sub" id="sub">Loading…</p></div>
  </div>

  <div class="card hide" id="create" style="margin-bottom:14px">
    <label for="code" style="margin-top:0">Course code</label>
    <input id="code" placeholder="CSC 401">
    <label for="title">Course title</label>
    <input id="title" placeholder="Software Engineering">
    <button id="add">Create course</button>
  </div>

  <div class="card"><div id="list"></div></div>
  <button class="ghost" onclick="location.href='dashboard.html'">Back</button>
  <div class="msg" id="msg" role="alert"></div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { doc, getDoc, getDocs, setDoc, addDoc, deleteDoc, collection, query, where } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let me, uid, all = {};

onAuthStateChanged(auth, async u => {
  if (!u) { location.href = "index.html"; return; }
  uid = u.uid;
  const d = await getDoc(doc(db, "users", uid));
  if (!d.exists() || !["student", "lecturer"].includes(d.data().role)) { location.href = "dashboard.html"; return; }
  me = d.data();
  if (me.role === "lecturer") $("create").classList.remove("hide");
  load();
});

async function load() {
  try {
    if (me.role === "lecturer") {
      const cs = await getDocs(query(collection(db, "courses"), where("lecturerId", "==", uid)));
      const rows = await Promise.all(cs.docs.map(async c => {
        const e = await getDocs(query(collection(db, "enrollments"), where("courseId", "==", c.id)));
        return { ...c.data(), n: e.size };
      }));
      $("sub").textContent = "Create your courses, then pick one when you start a class.";
      $("list").innerHTML = rows.length ? rows.map(c => "<div class='row'><div>" + esc(c.code) + " · " + esc(c.title) +
        "<br><span class='sub'>" + c.n + " student" + (c.n === 1 ? "" : "s") + " registered</span></div></div>").join("")
        : "<div class='sub'>No courses yet. Create your first course above.</div>";
    } else {
      const cs = await getDocs(collection(db, "courses"));
      const mine = new Set((await getDocs(query(collection(db, "enrollments"), where("studentId", "==", uid)))).docs.map(x => x.data().courseId));
      all = {}; cs.docs.forEach(c => all[c.id] = c.data());
      $("sub").textContent = "Register for the courses you take.";
      $("list").innerHTML = cs.size ? cs.docs.map(c => { const x = c.data(), on = mine.has(c.id);
        return "<div class='row'><div>" + esc(x.code) + " · " + esc(x.title) + "<br><span class='sub'>" + esc(x.lecturerName || "") +
          "</span></div><button class='" + (on ? "ghost" : "") + "' data-id='" + c.id + "' data-on='" + (on ? 1 : 0) + "'>" + (on ? "Leave" : "Register") + "</button></div>"; }).join("")
        : "<div class='sub'>No courses yet. Your lecturer will add them.</div>";
    }
  } catch (e) { $("msg").textContent = "Couldn't load courses. Check your internet connection and refresh."; }
}

$("add").onclick = async () => {
  const code = $("code").value.trim().toUpperCase(), title = $("title").value.trim();
  if (!code || !title) { $("msg").textContent = "Enter the course code and title."; return; }
  try {
    await addDoc(collection(db, "courses"), { code, title, lecturerId: uid, lecturerName: me.name, createdAt: Date.now() });
    $("code").value = ""; $("title").value = ""; $("msg").textContent = ""; load();
  } catch (e) { $("msg").textContent = "Couldn't create the course. Try again."; }
};

$("list").onclick = async e => {
  const b = e.target.closest("button"); if (!b || !b.dataset.id) return;
  const id = b.dataset.id, ref = doc(db, "enrollments", id + "_" + uid);
  try {
    if (b.dataset.on === "1") await deleteDoc(ref);
    else await setDoc(ref, { courseId: id, code: all[id].code, title: all[id].title, studentId: uid, name: me.name, idNumber: me.idNumber, enrolledAt: Date.now() });
    load();
  } catch (err) { $("msg").textContent = "Couldn't update your registration. Try again."; }
};
</script>
</body>
</html>
